name: Build SAFIYANU FLASH TOOL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build
      run: dotnet build SafiyanuFlashTool.csproj -c Release -o ./publish
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SAFIYANU-FLASH-TOOL-EXE
        path: ./publish/
